version: '1.0'

services:
  web:
    image: laravel-test-project:latest
    build:
      target: web
      context: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/public_html
    depends_on:
      - db
  
  db:
    platform: "linux/amd64"
    image: mysql:5.7
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:./test/data/mysql

volumes:
  dbdata: